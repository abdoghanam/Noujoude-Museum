<?xml version="1.0" encoding="UTF-8"?>
<!--
  Noujoude · Monogram Seal — hand vector redraw of the 512-native source asset
  ──────────────────────────────────────────────────────────────────────────
  HOW TO EDIT
    Re-tint        → the stops in the PALETTE block (5 gradients + 2 ink colours)
    Resize ring    → #frame circles (r 305 · 292 · 280 dotted)
    Move a leaf    → #branch-leaves: every leaf is one <use> with translate/rotate/scale
    Leaf size      → #leaf is 100 long × ≈25 wide pointing along +X; scale() sets the length
    Left wreath    → automatic: #branch mirrored on x = 512  (matrix(-1 0 0 1 1024 0))
    Right letter   → automatic: #n-half rotated 180° about (525.5 518)
    Crest / footer → only the RIGHT half is drawn; <use transform="scale(-1 1)"> mirrors it
    Background     → uncomment #ground for an ivory plate; file is transparent by default
    Regenerate the whole wreath rather than editing it by hand:
        node brand/_trace/branch7.mjs > brand/_trace/br.txt && node brand/_trace/swap2.mjs
    Verify after any change:
        node brand/_trace/render.mjs && node brand/_trace/tone.mjs
        node brand/_trace/ov.mjs full 100 100 824 824 1   (RED=source only CYAN=render only)

  MEASURED FROM SOURCE  (alpha + colour analysis of brand/_trace/base.png, a 1024 lanczos
  upscale of the 512-native webp — in that image svg y = png y + 32; the SVG rasterises
  straight to 1024 so there pixel y = svg y)
    seal centre 512 512 · rings r 305 (w 8.5) / 292 (w 4) / 280 (176 dots, w 5.4)
    monogram    x 312–738 · y 337–698 (includes the fleur at the crossing)
    letter      hairline stem x 425 w 13, y 391–655 · star serif at the foot y 672
                sail tip (386 362) · swash ball (349 431) · arch hands over to the
                diagonal at 479–498 @ 408
    crest       x 332–691 · y 96–260
    footer      x 440–585 · y 806–936 · spiral centre local (39 −8) → svg (551 863)
    wreath      stem r 358 on the arc a −46…58, curving in to r 308 at the tip a 84;
                leaf tips reach r 396…429; 14 nodes per branch ≈ every 9.5°, each bearing
                ONE leaf that runs ≈21° off the tangent (long leaves alternate with short),
                a shoulder leaf, and berry twigs on the bare stretches between pairs.
                The branches stop short of the bottom: no ink at all in a 75…105 above r 316.
    gold mean   ring #D4BFA0 (194) · wreath #D3B995 (189) · letter #D2B896 (188)
                crest #D1B694 (186) · footer #D1B390 (184)
    rose gem    #EFC9B8 → #DFB7A6 → #C08375

  FIDELITY OF THIS REDRAW (tone.mjs, ink pixels inside each region)
    ring −2% · wreath 0% · letter +4% · crest +2% · footer +5%
    all twelve 30° wreath sectors land between 0.92 and 1.08 of the source
  The wreath is the one place where the arrangement is still an interpretation: the total
  weight and the silhouette match, individual leaves sit a few degrees apart from the
  source. Everything else overlays almost exactly.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Noujoude monogram seal</title>
  <desc id="dsc">Ornate champagne-gold capital N with swash terminals inside a double-line ring
  with a dotted inner circle, framed by a laurel wreath with rose berries, crowned by a
  fleur-de-lis holding a rose gem and finished below by a gem finial.</desc>

  <defs>
    <!-- ═════════════════════ PALETTE ═════════════════════ -->
    <!-- tone shared by ring, wreath and ornaments.
         RADIAL because the source is a round seal whose gold mean follows the RADIUS,
         not the height: ring #D4BFA0 (194) · wreath #D3B995 (189) · crest #D1B694 (186)
         · footer #D1B390 (184). A vertical ramp pushed the crest to 205 and the bottom of
         the ring to 175; this one keeps the whole seal inside 182–197. -->
    <radialGradient id="gWide" gradientUnits="userSpaceOnUse" cx="512" cy="512" r="430">
      <stop offset=".63" stop-color="#DCC6A5"/>
      <stop offset=".72" stop-color="#D6BE9E"/>
      <stop offset=".86" stop-color="#D6B790"/>
      <stop offset="1"   stop-color="#D2B694"/>
    </radialGradient>
    <!-- ramp for the monogram only -->
    <!-- RADIAL on purpose: a 180° rotation reverses a linear ramp, which would
                 make the two halves of the letter disagree. A centred radial ramp is invariant. -->
    <radialGradient id="gLetter" gradientUnits="userSpaceOnUse" cx="525.5" cy="518" r="290">
      <stop offset="0"   stop-color="#DCC6A2"/>
      <stop offset=".45" stop-color="#D6BC96"/>
      <stop offset=".78" stop-color="#CDAE85"/>
      <stop offset="1"   stop-color="#C4A179"/>
    </radialGradient>
    <linearGradient id="gLeaf" x1="0" y1="0" x2=".85" y2=".6">
      <stop offset="0"   stop-color="#F2E1C6"/>
      <stop offset=".45" stop-color="#DCC19A"/>
      <stop offset="1"   stop-color="#B99A70"/>
    </linearGradient>
    <radialGradient id="gBerry" cx=".34" cy=".28" r=".82">
      <stop offset="0"   stop-color="#F2D8CE"/>
      <stop offset=".55" stop-color="#D9A997"/>
      <stop offset="1"   stop-color="#B07C6A"/>
    </radialGradient>
    <linearGradient id="gGem" x1=".1" y1="0" x2=".85" y2="1">
      <stop offset="0"   stop-color="#E8D8CC"/>
      <stop offset=".35" stop-color="#D8C0AE"/>
      <stop offset=".7"  stop-color="#C29E8B"/>
      <stop offset="1"   stop-color="#A67E6C"/>
    </linearGradient>

    <!-- ═════════════════════ ORNAMENTS ═════════════════════ -->
    <!-- laurel leaf · points along +X · 100 long × 32 wide -->
    <g id="leaf">
      <path d="M0 0C25-16 58-17 100 0 58 17 25 16 0 0Z" fill="url(#gLeaf)"/>
      <path d="M11 0C40-3 70-3 92 0" fill="none" stroke="#9C8058" stroke-width="1.4"
            stroke-linecap="round" opacity=".32"/>
    </g>

    <!-- berry sprig · two twigs, three rose beads -->
    <g id="sprig" fill="none" stroke="url(#gWide)" stroke-linecap="round">
      <path d="M0 0C15-3 27-9 36-18" stroke-width="2.6"/>
      <path d="M16-3C21 4 27 8 34 10" stroke-width="2"/>
      <circle cx="40" cy="-22" r="5.4" fill="url(#gBerry)" stroke="none"/>
      <circle cx="38" cy="11"  r="3.8" fill="url(#gBerry)" stroke="none"/>
    </g>

    <!-- letter serif · four-point sparkle: arms ±38, points −24 / +28 -->
    <g id="serif">
      <path d="M0-24C4-10 10-5 38 0 10 5 4 10 0 28-4 10-10 5-38 0-10-5-4-10 0-24Z"
            fill="url(#gLetter)"/>
    </g>

    <!-- ══════════════ ONE WREATH BRANCH (right · mirrored for left) ══════════════ -->
    <g id="branch">
      <path id="branch-stem" fill="none" stroke="url(#gWide)" stroke-linecap="round"
            stroke-width="4"
            d="M544.2 818.3Q566 828 600 828Q640 830 672 806A358 358 0 0 0 760.7 254.5"/>
      <g id="branch-leaves">
        <use href="#leaf" transform="translate(550 819.8) rotate(14.8) scale(.65)"/>
        <use href="#leaf" transform="translate(546.9 819.7) rotate(27.4) scale(.36)"/>
        <use href="#leaf" transform="translate(607.8 825.9) rotate(4.8) scale(.86)"/>
        <use href="#leaf" transform="translate(604.7 826.3) rotate(17.4) scale(.47)"/>
        <use href="#leaf" transform="translate(610.8 824.3) rotate(-6.9) scale(.57)"/>
        <use href="#leaf" transform="translate(669.7 822.4) rotate(-5.2) scale(1.13)"/>
        <use href="#leaf" transform="translate(666.7 823.4) rotate(7.4) scale(.62)"/>
        <use href="#leaf" transform="translate(728.2 800.1) rotate(-15.2) scale(1.32)"/>
        <use href="#leaf" transform="translate(725.4 801.5) rotate(-2.6) scale(.73)"/>
        <use href="#leaf" transform="translate(730.5 797.6) rotate(-26.9) scale(.87)"/>
        <use href="#leaf" transform="translate(775 758.1) rotate(-25.2) scale(1.35)"/>
        <use href="#leaf" transform="translate(772.5 760) rotate(-12.6) scale(.75)"/>
        <use href="#leaf" transform="translate(813.7 708.7) rotate(-35.2) scale(1.29)"/>
        <use href="#leaf" transform="translate(811.6 711) rotate(-22.6) scale(.71)"/>
        <use href="#leaf" transform="translate(814.9 705.6) rotate(-46.9) scale(.85)"/>
        <use href="#leaf" transform="translate(843.3 653.4) rotate(-45.2) scale(1.22)"/>
        <use href="#leaf" transform="translate(841.6 656) rotate(-32.6) scale(.67)"/>
        <use href="#leaf" transform="translate(862.8 593.7) rotate(-55.2) scale(1.14)"/>
        <use href="#leaf" transform="translate(861.6 596.6) rotate(-42.6) scale(.63)"/>
        <use href="#leaf" transform="translate(862.9 590.3) rotate(-66.9) scale(.75)"/>
        <use href="#leaf" transform="translate(871.6 531.5) rotate(-65.2) scale(1.04)"/>
        <use href="#leaf" transform="translate(871 534.6) rotate(-52.6) scale(.57)"/>
        <use href="#leaf" transform="translate(869.6 468.8) rotate(-75.2) scale(.95)"/>
        <use href="#leaf" transform="translate(869.4 471.9) rotate(-62.6) scale(.52)"/>
        <use href="#leaf" transform="translate(868.5 465.6) rotate(-86.9) scale(.63)"/>
        <use href="#leaf" transform="translate(856.6 407.3) rotate(-85.2) scale(.86)"/>
        <use href="#leaf" transform="translate(857 410.5) rotate(-72.6) scale(.47)"/>
        <use href="#leaf" transform="translate(833.2 349.1) rotate(-95.2) scale(.79)"/>
        <use href="#leaf" transform="translate(834.2 352.1) rotate(-82.6) scale(.43)"/>
        <use href="#leaf" transform="translate(831.2 346.5) rotate(-106.9) scale(.52)"/>
        <use href="#leaf" transform="translate(800.1 295.8) rotate(-105.2) scale(.72)"/>
        <use href="#leaf" transform="translate(801.5 298.6) rotate(-92.6) scale(.40)"/>
        <use href="#leaf" transform="translate(758.1 249) rotate(-115.2) scale(.66)"/>
        <use href="#leaf" transform="translate(760 251.5) rotate(-102.6) scale(.36)"/>
        <use href="#leaf" transform="translate(755.3 247.3) rotate(-126.9) scale(.44)"/>
      </g>
      <g id="branch-berries">
        <use href="#sprig" transform="translate(601.9 825.4) rotate(54.7) scale(.77)"/>
        <use href="#sprig" transform="translate(722.4 801.6) rotate(65.3) scale(.95)"/>
        <use href="#sprig" transform="translate(808.8 712.2) rotate(14.7) scale(1.16)"/>
        <use href="#sprig" transform="translate(859.4 598.6) rotate(25.3) scale(.82)"/>
        <use href="#sprig" transform="translate(868 474.6) rotate(-25.3) scale(.85)"/>
        <use href="#sprig" transform="translate(833.8 355.1) rotate(-14.7) scale(.57)"/>
        <use href="#sprig" transform="translate(760.7 254.5) rotate(-65.3) scale(.60)"/>
      </g>
    </g>

    <!-- ══════════════ HALF MONOGRAM (left stem + thorn + swash + foot serif) ══════════════
         Rotated 180° about (525.5 518) it yields the right stem, the tail-piece curl and the
         upper serif, so the letter body is exactly point-symmetric. The diagonal is separate. -->
    <g id="n-half">
      <!-- hairline stem: x 425, y 391→655 (w 13) — it emerges from under the sail -->
      <path d="M425 391V655" fill="none" stroke="url(#gLetter)" stroke-width="13"/>
      <!-- sparkle serif at the foot -->
      <use href="#serif" transform="translate(425 672)"/>
      <!-- THE SAIL (the "thorn"): one curved wedge whose long point leaves the tip at
           386,362, swells as it falls, and divides at its foot into the stem (x 418–431)
           and the near strand of the diagonal (x 435–446). Rotated 180° it becomes the
           right stem's foot, which is why the diagonal appears to end in a knife point.
           Left edge 387@364 · 407@372 · 414@380 · 417@388 | upper edge 408@364 · 424@372
           · 434@380 · 443@388   (brand/_trace/z_hook.png) -->
      <path d="M386 362C404 364 414 374 418 392L446 392C441 386 436 382 422 371 412 366 398 362 386 362Z"
            fill="url(#gLetter)"/>
      <!-- swash: spiral → ball terminal → arch. The arch is a BLADE 20–26 wide that crowns
           over the stem (solid x 360–426 at y 344) and plunges down-right, easing from
           dx/dy 2.75 to 0.75, to hand over to the diagonal's far strand at 479–498 y 408.
           underside 410@348 · 436@360 · 455@376 · 465@388 · 479@408 | outer 436@348 ·
           457@360 · 478@380 · 484@388 · 498@408   (brand/_trace/z_tl.png) -->
      <path d="M349 431C327 427 313 408 316 386 320 361 341 344 365 344" fill="none"
            stroke="url(#gLetter)" stroke-width="7" stroke-linecap="round"/>
      <path d="M364 338C398 334 438 346 462 364 474 373 484 390 498 408L479 408C465 388 448 366 428 352 418 346 390 348 366 348Z"
            fill="url(#gLetter)"/>
      <!-- diagonal strand: see #strand below — drawn once, in full, so its own
           symmetry centre (533 518) can differ from the letter's (525.5 518) -->
      <circle cx="349" cy="431" r="12.5" fill="url(#gLetter)"/>
    </g>

    <!-- ══════════════════ THE DIAGONAL (one strand + its 180° copy) ══════════════════
         Measured: two parallel strands, centre-to-centre 34, gap ≈ 18, running down-right
         at dx/dy ≈ 0.55. They do NOT cross — they TRADE WIDTHS: the left strand is 12 above
         the fleur and 19 below it, the right strand 19 above and 12 below. That swap, hidden
         behind the crossing fleur, is what reads as the ribbon twist.
         Table (y · centre · half-width): 368/425/7 · 396/444/6.5 · 420/460.5/6.3
           · 460/483.5/6.2 · 480/494/6.8 · 500/506/9.5 · 522/519/10.2 · 560/537.5/9.7
           · 600/558.5/9.5 · 630/576/9.6 · 650/592/10.2 · 658/600/10   (brand/_trace/diag.mjs) -->
    <g id="strand">
      <path d="M434 391C435.5 393 436.5 394.5 437.5 396C443.5 404.7 447.6 409.3 454.2 420C460.8 430.7 471.8 450 477.3 460C482.8 470 484 473.3 487.2 480C490.4 486.7 492.9 493 496.5 500C500.1 507 503.6 512 508.8 522C514 532 521.1 547 527.8 560C534.5 573 542.6 588.3 549 600C555.4 611.7 560.9 621.7 566.4 630C571.9 638.3 577.9 645.3 581.8 650C585.7 654.7 588.6 656.7 590 658L610 658C608.7 656.7 606.3 654.7 602.2 650C598.1 645.3 591.3 638.3 585.6 630C579.9 621.7 574.4 611.7 568 600C561.6 588.3 553.7 573 547.2 560C540.7 547 534.5 532 529.2 522C523.9 512 520.2 507 515.5 500C510.8 493 505.1 486.7 500.8 480C496.5 473.3 495.4 470 489.7 460C484 450 473.3 430.7 466.8 420C460.3 409.3 456.3 404.7 450.5 396C448 393.5 446 392 444 391Z"
            fill="url(#gLetter)"/>
      <!-- sheen: the source strands are lighter down the middle than at the edges -->
      <path d="M440 393C450 407 456 414 460.5 420 471 435 480 455 483.5 460 490 469 494 480 506 500 514 513 531 547 537.5 560 546 577 558 600 576 630 585 645 596 655 600 658"
            fill="none" stroke="#F4E6CE" stroke-width="3.4" stroke-linecap="round" opacity=".22"/>
    </g>

    <!-- ══════════════ CREST — only the right half is drawn ══════════════
         local origin = (512 173) · footprint rel x -174…174 · y -76…77 -->
    <g id="crest-half" fill="none" stroke="url(#gWide)" stroke-linecap="round">
      <!-- fleur side petal: open loop, x 2…58 · y −20…12 -->
      <path d="M12 12C2-6 12-20 30-20 48-20 58-4 50 8" stroke-width="9"/>
      <!-- arm: leaves the band, curls into a volute, then runs down onto the ring -->
      <path d="M16 28C36 12 58 8 72 18" stroke-width="7"/>
      <path d="M72 18C86 26 84 42 70 44 60 45 56 36 62 30" stroke-width="5.5"/>
      <path d="M74 22C94 30 108 38 116 46" stroke-width="5"/>
      <path d="M96 36C106 36 114 42 116 50" stroke-width="4.5"/>
      <circle cx="66" cy="34" r="5" fill="url(#gWide)" stroke="none"/>
    </g>

    <!-- ══════════════ FOOTER — only the right half is drawn ══════════════
         local origin = (512 871) · authored 1:1 · right scroll footprint x 533–572 · y 812–875 -->
    <g id="footer-half" fill="none" stroke="url(#gWide)" stroke-linecap="round">
      <!-- arm leaves the wreath tip, runs down and out, then curls into a spiral.
           (A wider/lower curl was tried against o_ft.jpg and pushed the box to +20%;
           this is the measured 6-wide arm, spiral centre local 39 −8 → svg 551 863.) -->
      <path d="M21-59C27-51 32-42 35-34C39-25 48-19 54-13C58-7 50 1 40 1C30 1 24-7 29-14C33-19 40-19 43-16"
            stroke-width="6"/>
    </g>
  </defs>

  <!-- ═════════════════════════ ARTWORK ═════════════════════════ -->
  <g id="artwork">
    <!-- optional ivory plate — the source asset is transparent
    <rect id="ground" width="1024" height="1024" fill="#F7F4EF"/> -->

    <g id="frame">
      <circle cx="512" cy="512" r="305" fill="none" stroke="url(#gWide)" stroke-width="8.5"/>
      <circle cx="512" cy="512" r="292" fill="none" stroke="url(#gWide)" stroke-width="4"/>
      <!-- 176 dots · dash period = 2π·280 / 176 -->
      <circle cx="512" cy="512" r="280" fill="none" stroke="url(#gWide)" stroke-width="5.4"
              stroke-dasharray="0.1 9.9" stroke-linecap="round"/>
    </g>

    <g id="wreath">
      <use href="#branch"/>
      <use href="#branch" transform="matrix(-1 0 0 1 1024 0)"/>
    </g>

    <g id="crest" transform="translate(512 173)">
      <g id="crest-right">
        <use href="#crest-half"/>
      </g>
      <use href="#crest-half" transform="scale(-1 1)"/>
      <!-- rose spire -->
      <path d="M0-78C11-52 17-30 14-11-14-11-17-30-14-52Z" fill="url(#gGem)"/>
      <path d="M0-76V-12" fill="none" stroke="#FBEAE2" stroke-width="2" opacity=".6"/>
      <!-- band and lower spur -->
      <path d="M-21 18H21L15 33H-15Z" fill="url(#gWide)"/>
      <path d="M0 33C9 40 8 52 0 62-8 52-9 40 0 33Z" fill="url(#gWide)"/>
      <circle cx="0" cy="-8" r="6" fill="url(#gWide)"/>
    </g>

    <g id="footer" transform="translate(512 871)">
      <use href="#footer-half"/>
      <use href="#footer-half" transform="scale(-1 1)"/>
      <!-- upper arrowhead gem · tip y 806 · widest 36 at 828 · point 852 -->
      <path d="M0-65C8-56 12-50 18-43 10-36 6-28 0-19-6-28-10-36-18-43-12-50-8-56Z"
            fill="url(#gGem)"/>
      <!-- lower diamond gem · y 848–920 · widest 48 at 884 -->
      <path d="M0-23 24 13 0 49-24 13Z" fill="url(#gGem)"/>
      <path d="M0-23 24 13 0 49-24 13Z" fill="none" stroke="url(#gWide)" stroke-width="3.4"/>
      <path d="M0-23V49M-24 13H24" fill="none" stroke="#FBEAE2" stroke-width="2" opacity=".45"/>
      <!-- hanging bead -->
      <path d="M0 50V54" stroke="url(#gWide)" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="60" r="5.5" fill="url(#gWide)"/>
    </g>

    <g id="monogram">
      <use href="#n-half"/>
      <use href="#n-half" transform="rotate(180 525.5 518)"/>
      <!-- the diagonal has its own symmetry centre: 533 518, 8 px right of the letter's -->
      <g id="diagonal">
        <use href="#strand"/>
        <use href="#strand" transform="rotate(180 533 518)"/>
      </g>
      <!-- rose fleur-de-lis set into the crossing. Authored 1:1 — local origin is the petal
           tip (523 482); footprint x 500–546 · y 482–531, measured by colour class
           (rose pixels 499–547 × 482–520). -->
      <g id="n-fleur" transform="translate(523 482)">
        <!-- central petal: tip 527,463 · base 523,489 — the rose body sits ABOVE the curls,
             not over them (source rose pixels x 515–532 · y 464–499; curls 497–550 · 502–518) -->
        <path d="M4 -19C9 -8 10 4 8 14 5 18-4 18-7 14-9 4-6 -8 4 -19Z" fill="url(#gGem)"/>
        <path d="M3 -12C7 -3 7 6 5 12" fill="none" stroke="#F6DED2" stroke-width="2.4"
              stroke-linecap="round" opacity=".5"/>
        <path d="M-10 18C-19 18-25 23-24 30-23 35-16 36-14 32" fill="none"
              stroke="url(#gGem)" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M10 18C19 18 25 23 24 30 23 35 16 36 14 32" fill="none"
              stroke="url(#gGem)" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M-9 17H9L6 26H-6Z" fill="url(#gWide)"/>
        <path d="M0 26C5 30 4 36 0 41-4 36-5 30 0 26Z" fill="url(#gWide)"/>
      </g>
    </g>
  </g>
</svg>
