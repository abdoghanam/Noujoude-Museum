      <circle cx="0" cy="60" r="5.5" fill="url(#gWide)"/>
    </g>

    <g id="monogram">
      <use href="#n-half"/>
      <use href="#n-half" transform="rotate(180 525.5 518)"/>
      <!-- the diagonal has its own symmetry centre: 533 518, 8 px right of the letter's -->
      <g id="diagonal">
        <use href="#strand"/>
        <use href="#strand" transform="rotate(180 533 518)"/>
      </g>
      <!-- rose fleur-de-lis set into the crossing. Authored 1:1 — local origin is the petal
           tip (523 482); footprint x 500–546 · y 482–531, measured by colour class
           (rose pixels 499–547 × 482–520). -->
      <g id="n-fleur" transform="translate(523 482)">
